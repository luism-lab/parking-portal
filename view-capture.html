<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Rivermont Parking Authority — Test Capture Viewer (private)</title>
<style>
  :root{--bg:#0b0d12; --card:#151822; --text:#eef0f4; --muted:#9aa2b1; --accent:#e0973b; --line:#242838;}
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:48px 16px;}
  .wrap{max-width:560px; width:100%}
  h1{font-size:18px; margin:0 0 6px}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 20px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px;}
  pre{background:#10131c; border:1px solid var(--line); border-radius:9px; padding:16px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; color:#bdf5dc; max-height:420px; overflow:auto;}
  .empty{color:var(--muted); font-size:13.5px;}
  .row{display:flex; gap:10px; margin-top:16px}
  button{flex:1; padding:11px; border-radius:8px; border:1px solid var(--line); background:#1b2030; color:var(--text); font-size:13.5px; cursor:pointer;}
  button.primary{background:var(--accent); color:#161616; border:none; font-weight:700;}
  button:hover{opacity:.9}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Test capture viewer</h1>
    <p class="sub">Only works in the same browser profile that submitted the checkout form. Reads localStorage — nothing is sent anywhere.</p>
    <div class="card">
      <div id="output"></div>
      <div class="row">
        <button id="refresh">Refresh</button>
        <button id="download">Download as JSON</button>
        <button id="clear">Clear</button>
      </div>
    </div>
  </div>

<script>
  var KEY = 'rivermont_test_capture';

  function render() {
    var out = document.getElementById('output');
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* ignore */ }
    if (!raw) {
      out.innerHTML = '<p class="empty">No capture found in this browser yet. Submit the form on checkout.html first, then come back here (same browser/profile).</p>';
      return;
    }
    var data;
    try { data = JSON.parse(raw); } catch (e) { data = raw; }
    out.innerHTML = '<pre>' + JSON.stringify(data, null, 2).replace(/</g, '&lt;') + '</pre>';
  }

  document.getElementById('refresh').addEventListener('click', render);

  document.getElementById('download').addEventListener('click', function () {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* ignore */ }
    if (!raw) { alert('Nothing to download yet.'); return; }
    var blob = new Blob([raw], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'rivermont_test_capture.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('clear').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    render();
  });

  render();
</script>
</body>
</html>
